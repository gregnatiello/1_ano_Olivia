<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembranças da Festa</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff5f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #d84a75; margin-bottom: 8px; }
    input[type="text"] { width: 90%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; text-align: center; }
    button, label.btn { display: block; width: 100%; padding: 14px 0; margin: 10px 0; background: #d84a75; color: white; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; font-size: 16px; text-align: center; box-sizing: border-box; }
    label.btn-video { background: #e06d53; }
    label.btn-secondary { background: #6c757d; }
    .hidden { display: none; }
    #status { margin-top: 15px; font-size: 14px; color: #555; word-wrap: break-word; }
    .limit-info { font-size: 12px; color: #888; margin-top: 10px; }
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(216,74,117,0.3); border-radius: 50%; border-top-color: #d84a75; animation: spin 1s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h2>Festa de 1 Aninho 🎉</h2>
    <p>Grave um vídeo ou tire fotos para guardar de recordação!</p>

    <!-- TELA 1: IDENTIFICAÇÃO -->
    <div id="step-name">
      <input type="text" id="guest-name" placeholder="Digite seu nome" maxlength="30" />
      <button onclick="saveNameAndOpenCamera()">Continuar e Abrir Câmera 📸</button>
    </div>

    <!-- TELA 2: PAINEL DE UPLOADS -->
    <div id="step-upload" class="hidden">
      <p>Olá, <strong id="display-name"></strong>!</p>

      <!-- Botão Foto Direta -->
      <label class="btn">
        📸 Tirar Outra Foto
        <input type="file" id="camera-photo" accept="image/*" capture="environment" class="hidden" onchange="handleFile(this)">
      </label>

      <!-- Botão Gravar Vídeo Direto (Até 1 min) -->
      <label class="btn btn-video">
        🎥 Gravar Vídeo (Até 1 min)
        <input type="file" id="camera-video" accept="video/*" capture="environment" class="hidden" onchange="handleFile(this)">
      </label>

      <!-- Botão Galeria / Arquivos do Celular -->
      <label class="btn btn-secondary">
        🖼️ Escolher da Galeria
        <input type="file" id="gallery-input" accept="image/*,video/*" class="hidden" onchange="handleFile(this)">
      </label>

      <p class="limit-info">Envios restantes: <span id="uploads-left">10</span>/10</p>
      <div id="status"></div>
    </div>
  </div>

  <script>
    // Cole aqui a sua URL do Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9NP9LJRZvfBcN4mXc_cmjBbGzn4gTlI2DCkh_Auw7jVxvNPMq7revvmq-8sWt764Y/exec";
    const MAX_UPLOADS = 10;
    const MAX_FILE_SIZE_MB = 50; // Limite de 50MB (adequado para vídeos curtos de ~1 min)

    let currentUploads = parseInt(localStorage.getItem("uploadCount") || "0");

    function saveNameAndOpenCamera() {
      const nameInput = document.getElementById("guest-name");
      const name = nameInput.value.trim();
      if (!name) return alert("Por favor, digite seu nome!");

      localStorage.setItem("guestName", name);
      showUploadScreen(name);

      // Dispara a câmera automaticamente pelo clique do botão
      document.getElementById("camera-photo").click();
    }

    function showUploadScreen(name) {
      document.getElementById("step-name").classList.add("hidden");
      document.getElementById("step-upload").classList.remove("hidden");
      document.getElementById("display-name").innerText = name;
      updateCounter();
    }

    function updateCounter() {
      const remaining = MAX_UPLOADS - currentUploads;
      document.getElementById("uploads-left").innerText = Math.max(0, remaining);
    }

    // Se já preencheu o nome antes, vai direto para a tela de envio
    const savedName = localStorage.getItem("guestName");
    if (savedName) {
      showUploadScreen(savedName);
    }

    async function handleFile(input) {
      if (currentUploads >= MAX_UPLOADS) {
        alert("Você atingiu o limite de envios para este aparelho. Obrigado!");
        input.value = "";
        return;
      }

      const file = input.files[0];
      if (!file) return;

      // Validação de Tamanho
      if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
        alert(`O arquivo é muito grande (Máximo ${MAX_FILE_SIZE_MB}MB). Se for um vídeo, reduza a resolução ou grave menos de 1 minuto.`);
        input.value = "";
        return;
      }

      // Validação da duração do vídeo (se for vídeo)
      if (file.type.startsWith("video/")) {
        const isUnder1Min = await validateVideoDuration(file);
        if (!isUnder1Min) {
          alert("O vídeo ultrapassou o limite de 60 segundos. Por favor, envie um vídeo mais curto.");
          input.value = "";
          return;
        }
      }

      const status = document.getElementById("status");
      status.innerHTML = `<span class="loading-spinner"></span> Enviando arquivo (pode levar alguns segundos)...`;

      const reader = new FileReader();
      reader.onload = function (e) {
        const base64Data = e.target.result.split(",")[1];
        const payload = {
          userName: localStorage.getItem("guestName") || "Convidado",
          fileName: file.name,
          mimeType: file.type || "application/octet-stream",
          base64: base64Data
        };

        fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            currentUploads++;
            localStorage.setItem("uploadCount", currentUploads);
            updateCounter();
            status.innerText = "✅ Enviado com sucesso!";
          } else {
            status.innerText = "❌ Erro ao enviar para o Drive. Tente novamente.";
          }
          input.value = "";
        })
        .catch(() => {
          status.innerText = "❌ Erro de conexão durante o upload. Tente novamente.";
          input.value = "";
        });
      };
      reader.readAsDataURL(file);
    }

    // Função que checa a duração do vídeo no próprio navegador
    function validateVideoDuration(file) {
      return new Promise((resolve) => {
        const video = document.createElement("video");
        video.preload = "metadata";
        video.onloadedmetadata = function() {
          window.URL.revokeObjectURL(video.src);
          // Permite tolerância de até 65 segundos
          resolve(video.duration <= 65);
        };
        video.onerror = function() {
          // Se o formato não permitir leitura prévia de metadados, deixa seguir com base no tamanho
          resolve(true);
        };
        video.src = URL.createObjectURL(file);
      });
    }
  </script>
</body>
</html>
