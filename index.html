<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Olivia - 1 Aninho</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    #f8eee4;

  color:
    #68647a;

  display:
    flex;

  justify-content:
    center;

}


/* ============================================================
   CONTAINER
============================================================ */

.app {

  width:
    100%;

  max-width:
    650px;

  min-height:
    100vh;

  padding:
    28px 22px 35px;

  text-align:
    center;

}


/* ============================================================
   TÍTULO
============================================================ */

.logo {

  margin-top:
    0;

}

.logo-title {

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(38px, 10vw, 58px);

  letter-spacing:
    5px;

  color:
    #8870ad;

  margin:
    0;

  line-height:
    1;

}


.logo-subtitle {

  font-size:
    clamp(36px, 9vw, 52px);

  font-family:
    "Brush Script MT",
    "Segoe Script",
    cursive;

  color:
    #ce7e9c;

  margin:
    4px 0 0;

  line-height:
    1;

}


.heart {

  color:
    #dc8ca3;

  font-size:
    20px;

  margin-top:
    10px;

}


/* ============================================================
   INTRODUÇÃO
============================================================ */

.intro {

  margin-top:
    45px;

}


.intro p {

  margin:
    0;

  font-size:
    16px;

  line-height:
    1.65;

  color:
    #5d6280;

}


/* ============================================================
   NOME
============================================================ */

.greeting {

  margin-top:
    34px;

}


.greeting-small {

  font-size:
    31px;

  font-weight:
    400;

  line-height:
    1;

  color:
    #66647a;

}


.name-input {

  width:
    100%;

  max-width:
    430px;

  margin:
    8px auto 0;

  border:
    none;

  outline:
    none;

  background:
    transparent;

  text-align:
    center;

  font-family:
    "Brush Script MT",
    "Segoe Script",
    cursive;

  font-size:
    clamp(42px, 10vw, 58px);

  color:
    #cf7f9b;

}


.name-input::placeholder {

  color:
    #cf7f9b;

  opacity:
    1;

}


.name-input:focus {

  border-bottom:
    1px solid #cf7f9b;

}


/* ============================================================
   BOTÕES
============================================================ */

.buttons {

  width:
    100%;

  max-width:
    426px;

  margin:
    32px auto 0;

}


.upload-button {

  position:
    relative;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  gap:
    16px;

  width:
    100%;

  min-height:
    60px;

  margin:
    10px 0;

  border:
    none;

  border-radius:
    20px;

  color:
    white;

  font-size:
    18px;

  font-weight:
    600;

  cursor:
    pointer;

  transition:
    transform .15s ease,
    box-shadow .15s ease;

  box-shadow:
    0 5px 14px rgba(100,80,110,.12);

}


.upload-button:active {

  transform:
    scale(.98);

}


.photo-button {

  background:
    #a37ec7;

}


.video-button {

  background:
    #db88a2;

}


.gallery-button {

  background:
    #a8b982;

}


.icon {

  width:
    30px;

  height:
    30px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

}


.icon svg {

  width:
    30px;

  height:
    30px;

  stroke:
    white;

  fill:
    none;

  stroke-width:
    2;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

}


.hidden-input {

  display:
    none;

}


/* ============================================================
   CONTADORES
============================================================ */

.counters {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    12px;

  width:
    100%;

  max-width:
    426px;

  margin:
    18px auto 0;

}


.counter {

  background:
    rgba(255,255,255,.72);

  border:
    1px solid rgba(210,195,185,.5);

  border-radius:
    20px;

  padding:
    12px 8px 14px;

}


.counter-icon {

  height:
    30px;

  margin-bottom:
    3px;

}


.counter-icon svg {

  width:
    28px;

  height:
    28px;

  fill:
    none;

  stroke-width:
    2;

  stroke-linecap:
    round;

  stroke-linejoin:
    round;

}


.photo-counter .counter-icon svg {

  stroke:
    #a37ec7;

}


.video-counter .counter-icon svg {

  stroke:
    #db88a2;

}


.counter-number {

  font-size:
    36px;

  font-weight:
    500;

  line-height:
    1;

}


.photo-counter .counter-number {

  color:
    #8870ad;

}


.video-counter .counter-number {

  color:
    #d57996;

}


.counter-label {

  margin-top:
    7px;

  font-size:
    12px;

  color:
    #777181;

}


/* ============================================================
   INFORMAÇÕES
============================================================ */

.info {

  width:
    100%;

  max-width:
    426px;

  margin:
    16px auto 0;

  padding:
    18px 14px;

  border-radius:
    20px;

  background:
    rgba(255,255,255,.68);

  border:
    1px solid rgba(210,195,185,.45);

}


.info-title {

  color:
    #8170a4;

  font-size:
    16px;

  font-weight:
    600;

  margin-bottom:
    9px;

}


.info p {

  margin:
    4px 0;

  font-size:
    13px;

  line-height:
    1.5;

  color:
    #706b7b;

}


/* ============================================================
   STATUS
============================================================ */

.status {

  width:
    100%;

  max-width:
    426px;

  margin:
    16px auto 0;

  min-height:
    30px;

  font-size:
    13px;

  line-height:
    1.5;

}


.status.success {

  color:
    #66805f;

  font-weight:
    600;

}


.status.error {

  color:
    #b65d65;

}


.status.uploading {

  color:
    #766d82;

}


/* ============================================================
   PROGRESSO
============================================================ */

.progress-container {

  width:
    100%;

  max-width:
    426px;

  margin:
    10px auto 0;

  display:
    none;

}


.progress-container.show {

  display:
    block;

}


.progress-text {

  font-size:
    12px;

  margin-bottom:
    5px;

  color:
    #777181;

}


.progress-bar {

  width:
    100%;

  height:
    7px;

  background:
    rgba(150,140,150,.18);

  border-radius:
    20px;

  overflow:
    hidden;

}


.progress-fill {

  width:
    0%;

  height:
    100%;

  background:
    #a37ec7;

  border-radius:
    20px;

  transition:
    width .15s ease;

}


/* ============================================================
   RESPONSIVO
============================================================ */

@media (max-width: 430px) {

  .app {

    padding:
      25px 18px 28px;

  }


  .intro {

    margin-top:
      38px;

  }


  .greeting {

    margin-top:
      30px;

  }


  .greeting-small {

    font-size:
      29px;

  }


  .buttons {

    margin-top:
      27px;

  }


  .upload-button {

    min-height:
      58px;

    border-radius:
      18px;

    font-size:
      16px;

  }

}


@media (max-width: 350px) {

  .logo-title {

    font-size:
      34px;

  }


  .logo-subtitle {

    font-size:
      35px;

  }


  .intro p {

    font-size:
      14px;

  }


  .upload-button {

    font-size:
      14px;

    gap:
      10px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- ========================================================
       CABEÇALHO
  ========================================================= -->

  <div class="logo">

    <h1 class="logo-title">
      OLIVIA
    </h1>

    <div class="logo-subtitle">
      1 aninho
    </div>

    <div class="heart">
      ♥
    </div>

  </div>


  <!-- ========================================================
       TEXTO
  ========================================================= -->

  <div class="intro">

    <p>
      Escolha como deseja registrar<br>
      esse momento especial.
    </p>

  </div>


  <!-- ========================================================
       NOME
  ========================================================= -->

  <div class="greeting">

    <div class="greeting-small">
      Olá,
    </div>

    <input
      type="text"
      id="guestName"
      class="name-input"
      maxlength="40"
      placeholder="Convidado!"
      autocomplete="name"
    >

  </div>


  <!-- ========================================================
       BOTÕES
  ========================================================= -->

  <div class="buttons">


    <!-- FOTO -->

    <label
      class="upload-button photo-button"
    >

      <span class="icon">

        <svg
          viewBox="0 0 24 24"
        >

          <path
            d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"
          />

          <circle
            cx="12"
            cy="13"
            r="3.5"
          />

        </svg>

      </span>

      <span>
        Tirar uma foto
      </span>

      <input
        type="file"
        class="hidden-input"
        id="photoInput"
        accept="image/*"
        capture="environment"
        multiple
      >

    </label>


    <!-- VÍDEO -->

    <label
      class="upload-button video-button"
    >

      <span class="icon">

        <svg
          viewBox="0 0 24 24"
        >

          <rect
            x="3"
            y="6"
            width="13"
            height="12"
            rx="2"
          />

          <path
            d="m16 10 5-3v10l-5-3z"
          />

        </svg>

      </span>

      <span>
        Gravar vídeo (até 40s)
      </span>

      <input
        type="file"
        class="hidden-input"
        id="videoInput"
        accept="video/*"
        capture="environment"
        multiple
      >

    </label>


    <!-- GALERIA -->

    <label
      class="upload-button gallery-button"
    >

      <span class="icon">

        <svg
          viewBox="0 0 24 24"
        >

          <rect
            x="3"
            y="4"
            width="18"
            height="16"
            rx="2"
          />

          <circle
            cx="8"
            cy="9"
            r="1.5"
          />

          <path
            d="m4 17 5-5 4 4 2-2 5 5"
          />

        </svg>

      </span>

      <span>
        Escolher da galeria
      </span>

      <input
        type="file"
        class="hidden-input"
        id="galleryInput"
        accept="image/*,video/*"
        multiple
      >

    </label>


  </div>


  <!-- ========================================================
       CONTADORES
  ========================================================= -->

  <div class="counters">


    <div class="counter photo-counter">

      <div class="counter-icon">

        <svg
          viewBox="0 0 24 24"
        >

          <path
            d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"
          />

          <circle
            cx="12"
            cy="13"
            r="3"
          />

        </svg>

      </div>

      <div
        class="counter-number"
        id="photosLeft"
      >
        10
      </div>

      <div class="counter-label">
        fotos restantes
      </div>

    </div>


    <div class="counter video-counter">

      <div class="counter-icon">

        <svg
          viewBox="0 0 24 24"
        >

          <rect
            x="3"
            y="6"
            width="13"
            height="12"
            rx="2"
          />

          <path
            d="m16 10 5-3v10l-5-3z"
          />

        </svg>

      </div>

      <div
        class="counter-number"
        id="videosLeft"
      >
        3
      </div>

      <div class="counter-label">
        vídeos restantes
      </div>

    </div>


  </div>


  <!-- ========================================================
       INFORMAÇÕES
  ========================================================= -->

  <div class="info">

    <div class="info-title">
      ♡ Importante ♡
    </div>

    <p>
      Máximo de <strong>10 fotos</strong> e
      <strong>3 vídeos</strong> por convidado.
    </p>

    <p>
      Vídeos de até <strong>40 segundos.</strong>
    </p>

    <p style="margin-top:12px;">
      Obrigado por compartilhar esse momento!
    </p>

  </div>


  <!-- ========================================================
       PROGRESSO
  ========================================================= -->

  <div
    id="progressContainer"
    class="progress-container"
  >

    <div
      id="progressText"
      class="progress-text"
    >
      Preparando...
    </div>

    <div class="progress-bar">

      <div
        id="progressFill"
        class="progress-fill"
      ></div>

    </div>

  </div>


  <!-- ========================================================
       STATUS
  ========================================================= -->

  <div
    id="status"
    class="status"
  ></div>


</div>


<script>


// ============================================================
// CONFIGURAÇÃO
// ============================================================

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwxhyb0nTOHSMEbbUuzmoqgcQ7KNg2p9hVWidVdQrZDOy2FvDzSzdPoRK7SCdLAb1jY/exec";


const MAX_PHOTOS = 10;

const MAX_VIDEOS = 3;

const MAX_VIDEO_SECONDS = 40;


// ============================================================
// TAMANHO DO BLOCO
// ============================================================
//
// 1 MB.
//
// O arquivo nunca é carregado inteiro na memória
// para ser enviado.
//
// ============================================================

const CHUNK_SIZE =
  1024 * 1024;


// ============================================================
// ELEMENTOS
// ============================================================

const guestName =
  document.getElementById(
    "guestName"
  );


const photoInput =
  document.getElementById(
    "photoInput"
  );


const videoInput =
  document.getElementById(
    "videoInput"
  );


const galleryInput =
  document.getElementById(
    "galleryInput"
  );


const photosLeft =
  document.getElementById(
    "photosLeft"
  );


const videosLeft =
  document.getElementById(
    "videosLeft"
  );


const status =
  document.getElementById(
    "status"
  );


const progressContainer =
  document.getElementById(
    "progressContainer"
  );


const progressText =
  document.getElementById(
    "progressText"
  );


const progressFill =
  document.getElementById(
    "progressFill"
  );


// ============================================================
// NOME SALVO
// ============================================================

const savedName =
  localStorage.getItem(
    "oliviaGuestName"
  );


if (savedName) {

  guestName.value =
    savedName;

}


// ============================================================
// SALVAR NOME
// ============================================================

guestName.addEventListener(
  "input",
  function() {

    localStorage.setItem(
      "oliviaGuestName",
      guestName.value.trim()
    );

  }
);


// ============================================================
// FILE INPUTS
// ============================================================

photoInput.addEventListener(
  "change",
  function() {

    handleFiles(
      Array.from(
        photoInput.files
      )
    );

    photoInput.value = "";

  }
);


videoInput.addEventListener(
  "change",
  function() {

    handleFiles(
      Array.from(
        videoInput.files
      )
    );

    videoInput.value = "";

  }
);


galleryInput.addEventListener(
  "change",
  function() {

    handleFiles(
      Array.from(
        galleryInput.files
      )
    );

    galleryInput.value = "";

  }
);


// ============================================================
// CARREGAR CONTADORES
// ============================================================

async function loadCounts() {

  const name =
    getGuestName();


  try {

    const response =
      await fetch(
        SCRIPT_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({

              action:
                "counts",

              userName:
                name

            })

        }
      );


    const data =
      await response.json();


    if (
      data.status ===
      "success"
    ) {

      updateCounters(
        data
      );

    }

  } catch (error) {

    console.error(
      "Erro ao carregar contadores:",
      error
    );

  }

}


// ============================================================
// ATUALIZAR CONTADORES
// ============================================================

function updateCounters(
  data
) {

  photosLeft.textContent =
    Math.max(
      0,
      Number(
        data.photosLeft || 0
      )
    );


  videosLeft.textContent =
    Math.max(
      0,
      Number(
        data.videosLeft || 0
      )
    );

}


// ============================================================
// NOME
// ============================================================

function getGuestName() {

  const name =
    guestName.value.trim();


  if (!name) {

    return "Convidado";

  }


  return name;

}


// ============================================================
// HANDLE DOS ARQUIVOS
// ============================================================

async function handleFiles(
  files
) {

  if (!files.length) {
    return;
  }


  const name =
    guestName.value.trim();


  if (!name) {

    alert(
      "Por favor, coloque seu nome antes de enviar os arquivos."
    );

    guestName.focus();

    return;

  }


  localStorage.setItem(
    "oliviaGuestName",
    name
  );


  // ----------------------------------------------------------
  // CARREGA CONTADORES ATUAIS
  // ----------------------------------------------------------

  await loadCounts();


  let availablePhotos =
    Number(
      photosLeft.textContent
    );


  let availableVideos =
    Number(
      videosLeft.textContent
    );


  // ----------------------------------------------------------
  // FILTRA ARQUIVOS
  // ----------------------------------------------------------

  const queue = [];


  for (
    const file of files
  ) {

    const isPhoto =
      file.type.startsWith(
        "image/"
      );


    const isVideo =
      file.type.startsWith(
        "video/"
      );


    if (!isPhoto && !isVideo) {

      continue;

    }


    // --------------------------------------------------------
    // FOTO
    // --------------------------------------------------------

    if (isPhoto) {

      if (
        availablePhotos <= 0
      ) {

        continue;

      }


      queue.push(
        file
      );

      availablePhotos--;

      continue;

    }


    // --------------------------------------------------------
    // VÍDEO
    // --------------------------------------------------------

    if (isVideo) {

      if (
        availableVideos <= 0
      ) {

        continue;

      }


      const valid =
        await validateVideoDuration(
          file
        );


      if (!valid) {

        alert(
          `"${file.name}" ultrapassa 40 segundos e não será enviado.`
        );

        continue;

      }


      queue.push(
        file
      );

      availableVideos--;

    }

  }


  if (!queue.length) {

    alert(
      "Nenhum arquivo disponível para envio. Verifique os limites de fotos e vídeos."
    );

    return;

  }


  // ----------------------------------------------------------
  // ENVIA FILA
  // ----------------------------------------------------------

  await uploadQueue(
    queue
  );

}


// ============================================================
// VALIDAR VÍDEO
// ============================================================

function validateVideoDuration(
  file
) {

  return new Promise(
    function(resolve) {

      const video =
        document.createElement(
          "video"
        );


      const url =
        URL.createObjectURL(
          file
        );


      video.preload =
        "metadata";


      video.onloadedmetadata =
        function() {

          const duration =
            video.duration;


          URL.revokeObjectURL(
            url
          );


          if (
            !isFinite(duration)
          ) {

            resolve(false);

            return;

          }


          resolve(
            duration <=
            MAX_VIDEO_SECONDS
          );

        };


      video.onerror =
        function() {

          URL.revokeObjectURL(
            url
          );

          // Se o navegador não conseguir
          // ler os metadados, não enviamos
          // para evitar vídeo acima do limite.

          resolve(false);

        };


      video.src =
        url;

    }
  );

}


// ============================================================
// FILA DE UPLOAD
// ============================================================

async function uploadQueue(
  queue
) {

  progressContainer.classList.add(
    "show"
  );


  let successful =
    0;


  let failed =
    0;


  for (
    let i = 0;
    i < queue.length;
    i++
  ) {

    const file =
      queue[i];


    progressText.textContent =
      `Enviando ${i + 1} de ${queue.length}: ${file.name}`;


    progressFill.style.width =
      "0%";


    status.className =
      "status uploading";


    status.textContent =
      "Preparando arquivo...";


    try {

      await uploadFile(
        file
      );


      successful++;


      status.className =
        "status success";


      status.textContent =
        `✓ ${file.name} enviado com sucesso.`;


      await loadCounts();


    } catch (error) {

      console.error(
        error
      );


      failed++;


      status.className =
        "status error";


      status.textContent =
        `✕ Erro em "${file.name}": ${error.message}`;

    }

  }


  progressContainer.classList.remove(
    "show"
  );


  if (
    failed === 0
  ) {

    status.className =
      "status success";


    status.textContent =
      successful === 1
        ? "✨ Arquivo enviado com sucesso! Obrigado por compartilhar esse momento!"
        : `✨ ${successful} arquivos enviados com sucesso! Obrigado por compartilhar esse momento!`;

  } else {

    status.className =
      "status error";


    status.textContent =
      `${successful} arquivo(s) enviado(s) e ${failed} não enviado(s). Veja a mensagem acima para identificar o problema.`;

  }


  await loadCounts();

}


// ============================================================
// UPLOAD DE UM ARQUIVO
// ============================================================

async function uploadFile(
  file
) {

  // ----------------------------------------------------------
  // INICIAR SESSÃO
  // ----------------------------------------------------------

  const initResponse =
    await fetch(
      SCRIPT_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify({

            action:
              "init",

            userName:
              getGuestName(),

            fileName:
              file.name,

            mimeType:
              file.type,

            fileSize:
              file.size

          })

      }
    );


  if (!initResponse.ok) {

    throw new Error(
      `Servidor respondeu HTTP ${initResponse.status}.`
    );

  }


  const initData =
    await initResponse.json();


  // ----------------------------------------------------------
  // LIMITE
  // ----------------------------------------------------------

  if (
    initData.status ===
    "limit_reached"
  ) {

    throw new Error(
      initData.message
    );

  }


  // ----------------------------------------------------------
  // ERRO
  // ----------------------------------------------------------

  if (
    initData.status !==
    "upload_initialized"
  ) {

    throw new Error(

      initData.message ||
      "Não foi possível iniciar o upload."

    );

  }


  const uploadUrl =
    initData.uploadUrl;


  if (!uploadUrl) {

    throw new Error(
      "O servidor não forneceu a URL de upload."
    );

  }


  // ----------------------------------------------------------
  // ENVIA BLOCOS
  // ----------------------------------------------------------

  let start =
    0;


  while (
    start <
    file.size
  ) {

    const end =
      Math.min(
        start +
        CHUNK_SIZE,
        file.size
      ) - 1;


    const chunk =
      file.slice(
        start,
        end + 1
      );


    const base64 =
      await blobToBase64(
        chunk
      );


    const response =
      await fetch(
        SCRIPT_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "chunk",

              uploadUrl:
                uploadUrl,

              start:
                start,

              end:
                end,

              total:
                file.size,

              base64:
                base64

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        `Servidor respondeu HTTP ${response.status} no bloco.`
      );

    }


    const data =
      await response.json();


    // --------------------------------------------------------
    // ERRO
    // --------------------------------------------------------

    if (
      data.status ===
      "error"
    ) {

      throw new Error(
        data.message ||
        "Erro no processamento do arquivo."
      );

    }


    // --------------------------------------------------------
    // FINALIZADO
    // --------------------------------------------------------

    if (
      data.status ===
      "success" &&
      data.completed
    ) {

      progressFill.style.width =
        "100%";


      return data;

    }


    // --------------------------------------------------------
    // PRÓXIMO BLOCO
    // --------------------------------------------------------

    if (
      typeof data.nextStart ===
      "number"
    ) {

      start =
        data.nextStart;

    } else {

      start =
        end + 1;

    }


    // --------------------------------------------------------
    // PROGRESSO
    // --------------------------------------------------------

    const percentage =
      Math.min(
        100,
        (
          start /
          file.size
        ) *
        100
      );


    progressFill.style.width =
      percentage.toFixed(1) +
      "%";


    progressText.textContent =
      `Enviando: ${file.name} — ${percentage.toFixed(0)}%`;

  }


  return {
    status:
      "success"
  };

}


// ============================================================
// BLOB -> BASE64
// ============================================================

function blobToBase64(
  blob
) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function() {

          const result =
            reader.result;


          const comma =
            result.indexOf(",");


          if (
            comma === -1
          ) {

            reject(
              new Error(
                "Não foi possível preparar o bloco do arquivo."
              )
            );

            return;

          }


          resolve(
            result.substring(
              comma + 1
            )
          );

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Erro ao ler o bloco do arquivo."
            )
          );

        };


      reader.readAsDataURL(
        blob
      );

    }
  );

}


// ============================================================
// INICIALIZA
// ============================================================

loadCounts();


</script>
