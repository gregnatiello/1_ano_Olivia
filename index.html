<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Olivia - 1 Aninho</title>


<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  min-height: 100%;

}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f8eee3;

  color: #756b82;

  min-height: 100vh;

}


/* =====================================================
   ÁREA PRINCIPAL
===================================================== */

.container {

  width: 100%;

  max-width: 650px;

  min-height: 100vh;

  margin: 0 auto;

  padding:
    28px 24px 30px;

  text-align: center;

}


/* =====================================================
   PRIMEIRA TELA
===================================================== */

#step-name {

  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

}


/* =====================================================
   OLIVIA
===================================================== */

.title {

  margin: 0;

  color: #8c72a9;

  font-family: Georgia, "Times New Roman", serif;

  font-size: 40px;

  font-weight: 400;

  letter-spacing: 4px;

  line-height: 1;

}


/* =====================================================
   1 ANINHO
===================================================== */

.subtitle {

  margin-top: 8px;

  color: #d17d99;

  font-family: cursive;

  font-size: 31px;

  line-height: 1;

}


/* =====================================================
   CORAÇÃO
===================================================== */

.heart {

  margin-top: 13px;

  color: #df91a8;

  font-size: 18px;

}


/* =====================================================
   TEXTO INTRODUÇÃO
===================================================== */

.intro {

  margin:

    42px 0 27px;

  color: #625c78;

  font-size: 15px;

  line-height: 1.6;

}


/* =====================================================
   CAMPO NOME
===================================================== */

.name-input {

  width: 100%;

  max-width: 330px;

  height: 48px;

  padding: 0 18px;

  border:

    1px solid
    #e2d5ca;

  border-radius: 16px;

  background:
    rgba(255,255,255,0.72);

  color: #756b82;

  font-size: 16px;

  text-align: center;

  outline: none;

}


.name-input::placeholder {

  color: #a49aa8;

}


.name-input:focus {

  border-color: #a483c8;

}


/* =====================================================
   BOTÃO CONTINUAR
===================================================== */

.continue-button {

  width: 100%;

  max-width: 330px;

  height: 50px;

  margin-top: 12px;

  border: none;

  border-radius: 16px;

  background: #a483c8;

  color: white;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;

}


/* =====================================================
   SEGUNDA TELA
===================================================== */

#step-upload {

  display: none;

  width: 100%;

}


/* =====================================================
   SAUDAÇÃO
===================================================== */

.guest-greeting {

  margin-top: 17px;

  margin-bottom: 17px;

}


.ola {

  display: block;

  color: #756b82;

  font-size: 25px;

  line-height: 1.1;

}


.guest-name {

  display: block;

  margin-top: 2px;

  color: #d17d99;

  font-family: cursive;

  font-size: 34px;

  line-height: 1.1;

  word-break: break-word;

}


/* =====================================================
   BOTÕES
===================================================== */

.buttons {

  width: 100%;

  max-width: 450px;

  margin: 0 auto;

  display: flex;

  flex-direction: column;

  gap: 10px;

}


.upload-button {

  width: 100%;

  height: 50px;

  border: none;

  border-radius: 16px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 11px;

  color: white;

  font-size: 15px;

  font-weight: 600;

  cursor: pointer;

  box-shadow:
    0 5px 12px
    rgba(0,0,0,0.08);

  transition:
    transform .12s ease,
    opacity .12s ease;

}


.upload-button:active {

  transform: scale(.985);

}


.photo-button {

  background: #a483c8;

}


.video-button {

  background: #dc8aa4;

}


.gallery-button {

  background: #a9ba7f;

}


.upload-button.disabled {

  opacity: .45;

  pointer-events: none;

}


/* =====================================================
   INPUT FILE
===================================================== */

input[type="file"] {

  display: none;

}


/* =====================================================
   ÍCONES
===================================================== */

.icon {

  width: 25px;

  height: 25px;

  fill: none;

  stroke: white;

  stroke-width: 2;

  stroke-linecap: round;

  stroke-linejoin: round;

  flex-shrink: 0;

}


/* =====================================================
   CONTADORES
===================================================== */

.counters {

  width: 100%;

  max-width: 450px;

  margin: 10px auto 0;

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 10px;

}


.counter {

  height: 76px;

  border-radius: 17px;

  border:
    1px solid
    rgba(220,205,195,.75);

  background:
    rgba(255,255,255,.72);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}


.counter-icon {

  font-size: 23px;

  line-height: 20px;

  margin-bottom: 3px;

}


.photo-counter .counter-icon {

  color: #a483c8;

}


.video-counter .counter-icon {

  color: #dc8aa4;

}


.counter-number {

  font-size: 23px;

  line-height: 24px;

  font-weight: 500;

}


.photo-counter .counter-number {

  color: #8c72a9;

}


.video-counter .counter-number {

  color: #d17d99;

}


.counter-text {

  margin-top: 2px;

  color: #756b82;

  font-size: 10px;

}


/* =====================================================
   CAIXA IMPORTANTE
===================================================== */

.important {

  width: 100%;

  max-width: 450px;

  margin: 10px auto 0;

  padding: 13px 10px;

  border-radius: 17px;

  border:
    1px solid
    rgba(220,205,195,.75);

  background:
    rgba(255,255,255,.72);

}


.important-title {

  margin-bottom: 7px;

  color: #8c72a9;

  font-size: 13px;

  font-weight: 600;

}


.important p {

  margin: 3px 0;

  color: #756b82;

  font-size: 11px;

  line-height: 1.45;

}


/* =====================================================
   STATUS
===================================================== */

#status {

  min-height: 38px;

  margin-top: 11px;

  padding-bottom: 5px;

  color: #756b82;

  font-size: 12px;

  line-height: 1.5;

}


.success {

  color: #71895b;

  font-weight: 600;

}


.error {

  color: #b95d70;

  font-weight: 600;

}


.loading {

  color: #756b82;

}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 480px) {

  .container {

    padding:
      8px 24px 25px;

  }


  .title {

    font-size: 38px;

    letter-spacing: 4px;

  }


  .subtitle {

    font-size: 30px;

  }


  .heart {

    margin-top: 11px;

  }


  .intro {

    margin:
      39px 0 26px;

    font-size: 14px;

  }


  .guest-greeting {

    margin-top: 17px;

    margin-bottom: 17px;

  }


  .ola {

    font-size: 25px;

  }


  .guest-name {

    font-size: 33px;

  }


  .upload-button {

    height: 50px;

    font-size: 14px;

  }


  .counter {

    height: 76px;

  }


  .important {

    padding:
      12px 8px;

  }

}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-width: 380px) {

  .container {

    padding-left: 18px;

    padding-right: 18px;

  }


  .title {

    font-size: 35px;

  }


  .subtitle {

    font-size: 28px;

  }


  .guest-name {

    font-size: 30px;

  }


  .upload-button {

    height: 48px;

    font-size: 13px;

  }

}


/* =====================================================
   CELULARES ALTOS
===================================================== */

@media (min-height: 800px) and (max-width: 480px) {

  .container {

    padding-top: 24px;

  }


  .intro {

    margin-top: 48px;

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =================================================
       TELA 1
  ================================================== -->

  <section id="step-name">


    <h1 class="title">
      OLIVIA
    </h1>


    <div class="subtitle">
      1 aninho
    </div>


    <div class="heart">
      ♥
    </div>


    <p class="intro">

      Escolha como deseja registrar<br>
      esse momento especial.

    </p>


    <input
      id="guest-name"
      class="name-input"
      type="text"
      placeholder="Digite seu nome"
      maxlength="50"
      autocomplete="name"
    >


    <button
      class="continue-button"
      type="button"
      onclick="continueToUpload()"
    >

      Continuar

    </button>


  </section>



  <!-- =================================================
       TELA 2
  ================================================== -->

  <section id="step-upload">


    <!-- NOME -->

    <div class="guest-greeting">

      <span class="ola">
        Olá,
      </span>

      <span
        id="display-name"
        class="guest-name"
      ></span>

    </div>



    <!-- =================================================
         BOTÕES
    ================================================== -->

    <div class="buttons">


      <!-- FOTO -->

      <label
        id="photo-button"
        class="upload-button photo-button"
        for="camera-photo"
      >

        <svg
          class="icon"
          viewBox="0 0 24 24"
        >

          <path
            d="M4 7h3l2-2h6l2 2h3v12H4z"
          />

          <circle
            cx="12"
            cy="13"
            r="3"
          />

        </svg>


        <span>
          Tirar uma foto
        </span>

      </label>


      <input
        type="file"
        id="camera-photo"
        accept="image/*"
        capture="environment"
      >



      <!-- VÍDEO -->

      <label
        id="video-button"
        class="upload-button video-button"
        for="camera-video"
      >

        <svg
          class="icon"
          viewBox="0 0 24 24"
        >

          <rect
            x="3"
            y="6"
            width="13"
            height="12"
            rx="2"
          />

          <path
            d="M16 10l5-3v10l-5-3z"
          />

        </svg>


        <span>
          Gravar vídeo (até 40s)
        </span>

      </label>


      <input
        type="file"
        id="camera-video"
        accept="video/*"
        capture="environment"
      >



      <!-- GALERIA -->

      <label
        id="gallery-button"
        class="upload-button gallery-button"
        for="gallery-input"
      >

        <svg
          class="icon"
          viewBox="0 0 24 24"
        >

          <rect
            x="3"
            y="4"
            width="18"
            height="16"
            rx="2"
          />

          <circle
            cx="8"
            cy="9"
            r="1.5"
          />

          <path
            d="M21 15l-5-5-6 6-2-2-5 5"
          />

        </svg>


        <span>
          Escolher da galeria
        </span>

      </label>


      <!--
        IMPORTANTE:
        multiple permite selecionar
        vários arquivos de uma vez.
      -->

      <input
        type="file"
        id="gallery-input"
        accept="image/*,video/*"
        multiple
      >


    </div>



    <!-- =================================================
         CONTADORES
    ================================================== -->

    <div class="counters">


      <div class="counter photo-counter">

        <div class="counter-icon">
          ♧
        </div>

        <div
          id="photos-left"
          class="counter-number"
        >
          10
        </div>

        <div class="counter-text">
          fotos restantes
        </div>

      </div>



      <div class="counter video-counter">

        <div class="counter-icon">
          ♡
        </div>

        <div
          id="videos-left"
          class="counter-number"
        >
          3
        </div>

        <div class="counter-text">
          vídeos restantes
        </div>

      </div>


    </div>



    <!-- =================================================
         INFORMAÇÕES
    ================================================== -->

    <div class="important">


      <div class="important-title">
        ♡ Importante ♡
      </div>


      <p>
        Máximo de <strong>10 fotos</strong> e
        <strong>3 vídeos</strong> por convidado.
      </p>


      <p>
        Vídeos de até <strong>40 segundos</strong>.
      </p>


      <p>
        Obrigado por compartilhar esse momento!
      </p>


    </div>



    <!-- STATUS -->

    <div id="status"></div>


  </section>


</div>



<script>


/* =====================================================
   URL DO SEU GOOGLE APPS SCRIPT
===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx9NP9LJRZvfBcN4mXc_cmjBbGzn4gTlI2DCkh_Auw7jVxvNPMq7revvmq-8sWt764Y/exec";


/* =====================================================
   LIMITES DO SITE
===================================================== */

const MAX_PHOTOS = 10;

const MAX_VIDEOS = 3;

const MAX_TOTAL = 13;


/* =====================================================
   ELEMENTOS
===================================================== */

const nameInput =
document.getElementById("guest-name");

const stepName =
document.getElementById("step-name");

const stepUpload =
document.getElementById("step-upload");

const displayName =
document.getElementById("display-name");

const status =
document.getElementById("status");

const cameraPhoto =
document.getElementById("camera-photo");

const cameraVideo =
document.getElementById("camera-video");

const galleryInput =
document.getElementById("gallery-input");

const photosLeft =
document.getElementById("photos-left");

const videosLeft =
document.getElementById("videos-left");

const photoButton =
document.getElementById("photo-button");

const videoButton =
document.getElementById("video-button");

const galleryButton =
document.getElementById("gallery-button");


/* =====================================================
   CONTADORES
===================================================== */

let photoCount = 0;

let videoCount = 0;


/* =====================================================
   CHAVE POR CONVIDADO
===================================================== */

function getGuestKey(name) {

  return String(name)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "_");

}


/* =====================================================
   CARREGA CONTADORES DO CONVIDADO
===================================================== */

function loadGuestCounters(name) {

  const key =
    getGuestKey(name);


  photoCount =
    parseInt(
      localStorage.getItem(
        "olivia_photos_" + key
      ) || "0",
      10
    );


  videoCount =
    parseInt(
      localStorage.getItem(
        "olivia_videos_" + key
      ) || "0",
      10
    );


  updateCounters();

}


/* =====================================================
   SALVA CONTADORES
===================================================== */

function saveGuestCounters() {

  const name =
    localStorage.getItem(
      "guestName"
    );


  if (!name) {
    return;
  }


  const key =
    getGuestKey(name);


  localStorage.setItem(
    "olivia_photos_" + key,
    photoCount
  );


  localStorage.setItem(
    "olivia_videos_" + key,
    videoCount
  );

}


/* =====================================================
   CONTINUAR
===================================================== */

function continueToUpload() {


  const name =
    nameInput.value.trim();


  if (!name) {

    alert(
      "Por favor, digite seu nome."
    );

    nameInput.focus();

    return;

  }


  localStorage.setItem(
    "guestName",
    name
  );


  displayName.textContent =
    name;


  loadGuestCounters(
    name
  );


  stepName.style.display =
    "none";


  stepUpload.style.display =
    "block";


}


/* =====================================================
   ENTER NO NOME
===================================================== */

nameInput.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      continueToUpload();

    }

  }
);


/* =====================================================
   SE JÁ TEM NOME SALVO
===================================================== */

const savedName =
localStorage.getItem(
  "guestName"
);


if (savedName) {

  displayName.textContent =
    savedName;

  loadGuestCounters(
    savedName
  );

  stepName.style.display =
    "none";

  stepUpload.style.display =
    "block";

}


/* =====================================================
   ATUALIZA CONTADORES
===================================================== */

function updateCounters() {


  const photosRemaining =
    Math.max(
      0,
      MAX_PHOTOS - photoCount
    );


  const videosRemaining =
    Math.max(
      0,
      MAX_VIDEOS - videoCount
    );


  photosLeft.textContent =
    photosRemaining;


  videosLeft.textContent =
    videosRemaining;


  const total =
    photoCount +
    videoCount;


  /* FOTO */

  if (
    photosRemaining <= 0 ||
    total >= MAX_TOTAL
  ) {

    photoButton.classList.add(
      "disabled"
    );

  } else {

    photoButton.classList.remove(
      "disabled"
    );

  }


  /* VIDEO */

  if (
    videosRemaining <= 0 ||
    total >= MAX_TOTAL
  ) {

    videoButton.classList.add(
      "disabled"
    );

  } else {

    videoButton.classList.remove(
      "disabled"
    );

  }


  /* GALERIA */

  if (
    total >= MAX_TOTAL
  ) {

    galleryButton.classList.add(
      "disabled"
    );

  } else {

    galleryButton.classList.remove(
      "disabled"
    );

  }

}


/* =====================================================
   FOTO
===================================================== */

cameraPhoto.addEventListener(
  "change",
  function() {

    const files =
      Array.from(
        this.files
      );


    if (!files.length) {
      return;
    }


    processFiles(
      files
    );


    this.value = "";

  }
);


/* =====================================================
   VÍDEO
===================================================== */

cameraVideo.addEventListener(
  "change",
  function() {

    const files =
      Array.from(
        this.files
      );


    if (!files.length) {
      return;
    }


    processFiles(
      files
    );


    this.value = "";

  }
);


/* =====================================================
   GALERIA
===================================================== */

galleryInput.addEventListener(
  "change",
  function() {

    const files =
      Array.from(
        this.files
      );


    if (!files.length) {
      return;
    }


    processFiles(
      files
    );


    this.value = "";

  }
);


/* =====================================================
   PROCESSA OS ARQUIVOS
===================================================== */

async function processFiles(files) {


  const totalAtual =
    photoCount +
    videoCount;


  const totalSelecionado =
    files.length;


  /*
    PRIMEIRO:
    verifica o limite total.
  */

  if (
    totalAtual +
    totalSelecionado >
    MAX_TOTAL
  ) {

    const restantes =
      MAX_TOTAL -
      totalAtual;


    alert(
      "Você pode enviar no máximo 13 arquivos por convidado.\n\n" +
      "Você ainda pode enviar " +
      restantes +
      " arquivo(s)."
    );

    return;

  }


  /*
    Conta fotos e vídeos
    selecionados.
  */

  let selectedPhotos = 0;

  let selectedVideos = 0;


  files.forEach(
    function(file) {

      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        selectedPhotos++;

      }


      else if (
        file.type.startsWith(
          "video/"
        )
      ) {

        selectedVideos++;

      }

    }
  );


  /*
    Verifica limite de fotos.
  */

  if (
    photoCount +
    selectedPhotos >
    MAX_PHOTOS
  ) {

    alert(
      "O limite é de 10 fotos por convidado."
    );

    return;

  }


  /*
    Verifica limite de vídeos.
  */

  if (
    videoCount +
    selectedVideos >
    MAX_VIDEOS
  ) {

    alert(
      "O limite é de 3 vídeos por convidado."
    );

    return;

  }


  /*
    Arquivos inválidos.
  */

  const invalidFiles =
    files.filter(
      function(file) {

        return !file.type.startsWith("image/") &&
               !file.type.startsWith("video/");

      }
    );


  if (
    invalidFiles.length > 0
  ) {

    alert(
      "Um ou mais arquivos selecionados não são fotos ou vídeos."
    );

    return;

  }


  /*
    ENVIA UM POR UM.

    Isso é importante para não mandar
    vários arquivos enormes dentro de
    uma única requisição.
  */

  let enviados = 0;

  let erros = 0;


  status.innerHTML =
    `<span class="loading">
      Preparando arquivos...
    </span>`;


  for (
    let i = 0;
    i < files.length;
    i++
  ) {


    const file =
      files[i];


    status.innerHTML =
      `<span class="loading">
        Enviando ${i + 1} de ${files.length}...
      </span>`;


    try {


      await uploadFile(
        file
      );


      /*
        Só aumenta o contador
        depois de receber sucesso.
      */

      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        photoCount++;

      }


      else if (
        file.type.startsWith(
          "video/"
        )
      ) {

        videoCount++;

      }


      saveGuestCounters();

      updateCounters();


      enviados++;


    } catch (error) {


      console.error(
        "Erro:",
        error
      );


      erros++;

    }

  }


  /*
    RESULTADO FINAL
  */

  if (
    erros === 0
  ) {

    status.innerHTML =
      `<div class="success">
        ✓ ${enviados} arquivo(s) enviado(s) com sucesso!
      </div>`;

  }

  else {

    status.innerHTML =
      `<div class="error">
        ${enviados} arquivo(s) enviado(s).
        <br>
        ${erros} arquivo(s) não puderam ser enviados.
      </div>`;

  }


  updateCounters();

}


/* =====================================================
   ENVIA ARQUIVO PARA O GOOGLE APPS SCRIPT
===================================================== */

function uploadFile(file) {


  return new Promise(
    function(resolve, reject) {


      const reader =
        new FileReader();


      reader.onload =
        async function(event) {


          try {


            const result =
              event.target.result;


            const base64 =
              result.split(",")[1];


            if (!base64) {

              reject(
                new Error(
                  "Não foi possível ler o arquivo."
                )
              );

              return;

            }


            const guestName =
              localStorage.getItem(
                "guestName"
              ) ||
              "Convidado";


            /*
              EXATAMENTE os campos
              esperados pelo seu
              doPost(e).
            */

            const payload = {

              userName:
                guestName,

              fileName:
                file.name,

              mimeType:
                file.type,

              base64:
                base64

            };


            /*
              Não usamos headers
              personalizados.

              Isso evita preflight/CORS
              desnecessário no Apps Script.
            */

            const response =
              await fetch(
                SCRIPT_URL,
                {

                  method:
                    "POST",

                  body:
                    JSON.stringify(
                      payload
                    )

                }
              );


            const text =
              await response.text();


            console.log(
              "Resposta Google Apps Script:",
              text
            );


            let data;


            try {

              data =
                JSON.parse(
                  text
                );

            }

            catch (error) {

              reject(
                new Error(
                  "O Google não retornou uma resposta JSON válida."
                )
              );

              return;

            }


            if (
              data.status ===
              "success"
            ) {

              resolve(
                data
              );

            }

            else {

              reject(
                new Error(
                  data.message ||
                  "Erro ao salvar arquivo."
                )
              );

            }


          }

          catch (error) {

            reject(
              error
            );

          }

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Não foi possível ler o arquivo."
            )
          );

        };


      reader.readAsDataURL(
        file
      );


    }
  );

}


/* =====================================================
   INICIA CONTADORES
===================================================== */

updateCounters();


</script>
